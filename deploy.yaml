name: Deploy

on:
  push:
    branches: [main]

  # Allow manual runs from the GitHub Actions UI.
  workflow_dispatch:

jobs:
  deploy:
    # Use the tested template release. Upgrade this pin deliberately.
    uses: icicle-ai/cicd-templates/.github/workflows/deploy-service.yaml@v2.0.0
    secrets:
      TAPIS_TOKEN: ${{ secrets.TAPIS_TOKEN }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      # Optional, only if the health endpoint requires a bearer token.
      HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
