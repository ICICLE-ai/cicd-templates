schema-version: 2

# ──────────────────────────────────────────────────────────────────────
# Service Identity
# ──────────────────────────────────────────────────────────────────────

# Image name and pod ID must match exactly in schema 2.
# Use 4-64 lowercase letters/digits, starting with a letter; no hyphens.
#
# Example image:
#   ghcr.io/icicle-ai/myservice:0.1.0
#
service-name: myservice

# Semantic version (semver).
# Becomes the version tag. CI deploys a separate unique build tag and records
# its digest, so repeating this version cannot reuse the previous deployment.
#
# Example:
#   0.1.0
#
service-version: 0.1.0

# Team, lab, grant, or umbrella project name; recorded as an image label.
#
# Example:
#   icicle-project
#
project-name: icicle-project

# Logical service category; recorded as an image label.
#
# Allowed values:
# - ai
# - ci
# - domain
#
service-type: ai

# Existing Tapis pod whose image CI updates, restarts, and verifies.
# ICICLE requires 4-64 lowercase alphanumeric characters, starting with a
# letter: ^[a-z][a-z0-9]{3,63}$. No spaces, hyphens, or underscores.
# Repeat service-name exactly. Schema 1 keeps separate legacy names supported.
# Its image repository must be permitted by the site's allowlist. CI only
# changes the image; the platform team owns environment, networking, and resources.
#
# Example:
#   myservice
#
pod-name: myservice

# ──────────────────────────────────────────────────────────────────────
# Runtime Configuration
# ──────────────────────────────────────────────────────────────────────

# Application runtime.
#
# Allowed values:
# - python          backend Python service (uv)
# - node-backend    backend Node service (Fastify/Express, long-lived process)
# - node-frontend   React/Vue/Svelte SPA — Node builds it, nginx serves it,
#                   no Node process runs in production
#
runtime-type: python

# Quote MAJOR.MINOR.PATCH to pin the interpreter exactly.
# Existing MAJOR.MINOR remains valid and resolves a patch on that minor line.
#
# This is the version the build uses to install the interpreter/toolchain.
# For node-frontend it is the Node version used to BUILD the frontend.
#
# Examples:
#   "3.13.16"    (python)
#   "24.22.0"   (node-backend, node-frontend)
#
runtime-version: "3.13.16"

# Python only: exclude the dev dependency group from the final image.
# Declare application dependencies in [project.dependencies]. Existing services
# that rely on dev dependencies may set true or omit this field (legacy default).
# Ignored by Node runtimes.
include-dev-dependencies: false

# Node only: auto reuses dependency layers when safe; root lifecycle hooks,
# workspaces, and local dependencies install with full source. Use full for
# unusual dependency hooks that read application files. Non-secret .npmrc is
# supported; embedded credentials are rejected.
# npm-install-mode: auto  # auto or full; omit for Python

# Optional rollout settings. Omit health-url to discover the pod's default HTTP
# endpoint, or its only HTTP endpoint. Use /health for backends, /healthcheck for
# frontends; the response must expose the current BUILD_SHA. No redirects.
# health-url: https://myservice.pods.icicleai.tapis.io/health
# rollout-timeout: 300  # integer seconds, 30-1800

# ──────────────────────────────────────────────────────────────────────
# System Packages
# ──────────────────────────────────────────────────────────────────────

# Optional build-time APT packages.
#
# Leave as [] if your service does not need build dependencies.
#
# Common examples:
# - build-essential → compilers and build tools
# - gcc             → C compiler
# - libpq-dev       → PostgreSQL headers
#
build-apt-packages:
  - build-essential
  - gcc
  - libpq-dev

# Optional runtime APT packages.
#
# Leave as [] if your service does not need runtime system packages.
#
# ca-certificates is strongly recommended for HTTPS/TLS support.
#
# Common examples:
# - ca-certificates → trusted TLS certificates
# - ffmpeg          → video/audio processing
# - libgl1          → OpenGL support for CV/ML workloads
#
runtime-apt-packages:
  - ca-certificates
  - ffmpeg
  - libgl1
