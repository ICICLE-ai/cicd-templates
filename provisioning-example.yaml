# Copy to provisioning/myservice.yaml in the trusted operations repository.
# Use a real, already-pushed unique image tag and its matching commit SHA.
schema-version: 1
pod-name: myservice
runtime-type: python  # python, node-backend, or node-frontend
image: ghcr.io/icicle-ai/myservice:sha-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-123-1
build-sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
developers: [developerone]  # Canonical Tapis usernames; always USER.
time-to-stop-default: -1  # Explicitly keep this service running.

# Omit volumes for services that do not need persistent data.
volumes:
  - volume-id: myservicedata
    mount-path: /data
    size-limit: 1024  # MB; Tapis reports usage, this is not an enforced quota.
    read-only: false

# Nonsecret values only. Configure application secrets through the platform.
environment-variables:
  PORT: "5000"  # Default for new pods; sets container PORT and pod networking.
# For a frontend, for example:
# environment-variables:
#   BACKEND_URL: https://backend.example.org
