# Schema 3 example for shared templates v2.2.0 and later.
schema-version: 3

# Both the image name and deployment pod ID. No separate pod-name field.
# Use 4-64 lowercase letters/digits, starting with a letter; no reserved names.
service-name: myservice
service-version: 0.1.0
project-name: myproject
service-type: ai

runtime-type: python
runtime-version: "3.13.16"
include-dev-dependencies: false
build-apt-packages: []
runtime-apt-packages: []
