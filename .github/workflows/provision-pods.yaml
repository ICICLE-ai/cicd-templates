name: Provision pods and volumes

on:
  workflow_dispatch:
    inputs:
      pod-name:
        description: Pod name from the reviewed provisioning catalog
        required: true
        type: string
      apply:
        description: Create missing resources and start the pod (false previews only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  provision:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tapis
    # Share this group with pod-lifecycle.yaml; volumes can serve several pods.
    concurrency:
      group: tapis-operations-${{ vars.TAPIS_TENANT_ID || 'icicleai' }}
      cancel-in-progress: false
    steps:
      - name: Validate dispatch inputs
        id: inputs
        env:
          POD_NAME: ${{ inputs.pod-name }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          [[ "$POD_NAME" =~ ^[a-z][a-z0-9]{3,63}$ ]] \
            || { echo "Pod names need 4–64 lowercase letters/digits, starting with a letter." >&2; exit 1; }
          case "$APPLY" in true|false) ;; *) echo "Apply must be true or false." >&2; exit 1 ;; esac
          echo "config=provisioning/${POD_NAME}.yaml" >> "$GITHUB_OUTPUT"

      - name: Checkout reviewed platform catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Validate catalog configuration
        env:
          CONFIG_PATH: ${{ steps.inputs.outputs.config }}
        run: python -m scripts.pod_config --config "$CONFIG_PATH" --catalog-root provisioning

      - name: Plan or apply provisioning
        env:
          CONFIG_PATH: ${{ steps.inputs.outputs.config }}
          APPLY: ${{ inputs.apply }}
          TAPIS_BASE_URL: ${{ vars.TAPIS_BASE_URL || 'https://icicleai.tapis.io' }}
          TAPIS_TENANT_ID: ${{ vars.TAPIS_TENANT_ID || 'icicleai' }}
          TAPIS_PROVISION_TOKEN: ${{ secrets.TAPIS_PROVISION_TOKEN }}
          TAPIS_REQUIRED_ADMINS: ${{ secrets.TAPIS_REQUIRED_ADMINS }}
          SLACK_PROVISIONING_WEBHOOK_URL: ${{ secrets.SLACK_PROVISIONING_WEBHOOK_URL }}
          HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
        run: |
          set -euo pipefail
          arguments=(--config "$CONFIG_PATH" --owner "$GITHUB_REPOSITORY")
          if [ "$APPLY" = true ]; then arguments+=(--apply); fi
          python -m scripts.provision_tapis "${arguments[@]}"
