name: Build and Deploy ICICLE Service

on:
  workflow_call:
    secrets:
      TAPIS_TOKEN:
        description: Shared Tapis token, explicitly passed by the calling repository
        required: true
      REGISTRY_USERNAME:
        description: Optional GHCR username; provide together with REGISTRY_PASSWORD
        required: false
      REGISTRY_PASSWORD:
        description: Optional GHCR token; otherwise use the calling repository GITHUB_TOKEN
        required: false
      HEALTHCHECK_TOKEN:
        description: Optional bearer token for the application's health endpoint
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  TAPIS_BASE_URL: https://icicleai.tapis.io

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Serialize this service's builds/deployments across branches. Never cancel
    # a run between changing the pod image and verifying its replacement.
    concurrency:
      group: icicle-deploy-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Checkout service repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch matching shared templates
        id: templates
        env:
          TEMPLATES_REPOSITORY: ${{ job.workflow_repository }}
          TEMPLATES_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test -n "$TEMPLATES_REPOSITORY" && test -n "$TEMPLATES_SHA"
          TEMPLATES_DIR=$(mktemp -d "${RUNNER_TEMP}/icicle-templates.XXXXXX")
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
            "https://github.com/${TEMPLATES_REPOSITORY}/archive/${TEMPLATES_SHA}.tar.gz" \
            -o "${TEMPLATES_DIR}/source.tar.gz"
          tar -xzf "${TEMPLATES_DIR}/source.tar.gz" --strip-components=1 -C "$TEMPLATES_DIR"
          rm "${TEMPLATES_DIR}/source.tar.gz"
          echo "requirements_hash=$(sha256sum "$TEMPLATES_DIR/scripts/requirements.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          TEMPLATE_VERSION=$(cat "$TEMPLATES_DIR/VERSION")
          [[ "$TEMPLATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "Invalid shared template VERSION" >&2; exit 1; }
          echo "TEMPLATES_DIR=${TEMPLATES_DIR}" >> "$GITHUB_ENV"
          echo "TEMPLATE_VERSION=${TEMPLATE_VERSION}" >> "$GITHUB_ENV"
          printf 'Shared templates: `%s` at `%s`\n\n' "$TEMPLATE_VERSION" "$TEMPLATES_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Hash the fetched release file directly: it is outside GITHUB_WORKSPACE,
      # where setup-python cache-dependency-path cannot reliably hash it.
      - name: Cache validation pip downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: validation-pip-${{ runner.os }}-${{ runner.arch }}-3.12-${{ steps.templates.outputs.requirements_hash }}

      - name: Install validation dependencies
        run: python -m pip install -r "$TEMPLATES_DIR/scripts/requirements.txt"

      - name: Validate and parse icicle-service.yaml
        id: config
        run: |
          python "$TEMPLATES_DIR/scripts/validate_config.py" icicle-service.yaml \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Buildtime Args
        id: buildtime
        env:
          RUNTIME: ${{ steps.config.outputs.runtime_type }}
          RUNTIME_VERSION: ${{ steps.config.outputs.runtime_version }}
          BUILD_APT_PACKAGES: ${{ steps.config.outputs.build_apt }}
          RUNTIME_APT_PACKAGES: ${{ steps.config.outputs.runtime_apt }}
          INCLUDE_DEV_DEPENDENCIES: ${{ steps.config.outputs.include_dev_dependencies }}
          NPM_INSTALL_MODE: ${{ steps.config.outputs.npm_install_mode }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_VERSION: ${{ steps.config.outputs.service_version }}
        run: |
          set -eu
          {
            echo "build_args<<EOF"
            case "$RUNTIME" in
              python)
                echo "PYTHON_VERSION=${RUNTIME_VERSION}"
                echo "INCLUDE_DEV_DEPENDENCIES=${INCLUDE_DEV_DEPENDENCIES}"
                ;;
              node-backend|node-frontend)
                echo "NODE_VERSION=${RUNTIME_VERSION}"
                echo "NPM_INSTALL_MODE=${NPM_INSTALL_MODE}"
                ;;
            esac
            echo "BUILD_APT_PACKAGES=${BUILD_APT_PACKAGES}"
            echo "RUNTIME_APT_PACKAGES=${RUNTIME_APT_PACKAGES}"
            echo "BUILD_SHA=${BUILD_SHA}"
            echo "BUILD_VERSION=${BUILD_VERSION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Copy official build sources
        env:
          RUNTIME: ${{ steps.config.outputs.runtime_type }}
        run: |
          set -eu
          cp "$TEMPLATES_DIR/$RUNTIME/Dockerfile" Dockerfile
          if [ "$RUNTIME" = "node-frontend" ]; then
            cp "$TEMPLATES_DIR/node-frontend/nginx.conf" nginx.conf
            cp "$TEMPLATES_DIR/node-frontend/nginx-api.conf.template" nginx-api.conf.template
            cp "$TEMPLATES_DIR/node-frontend/entrypoint.sh" nginx-entrypoint.sh
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate registry credentials
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if { [ -n "$REGISTRY_USERNAME" ] && [ -z "$REGISTRY_PASSWORD" ]; } || \
             { [ -z "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; }; then
            echo "Provide both REGISTRY_USERNAME and REGISTRY_PASSWORD, or neither to use GITHUB_TOKEN. The calling repository must have write access to the GHCR package." >&2
            exit 1
          fi

      - name: Log in to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}

      - name: Compute image references
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE_NAME: ${{ steps.config.outputs.service_name }}
          SERVICE_VERSION: ${{ steps.config.outputs.service_version }}
          BUILD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -eu
          OWNER_LC=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE="${REGISTRY}/${OWNER_LC}/${SERVICE_NAME}"
          echo "tag=${IMAGE}:${SERVICE_VERSION}" >> "$GITHUB_OUTPUT"
          # Tapis checks the repository portion of tagged images against its
          # allowlist. A unique build tag avoids overwriting the deployed image
          # while remaining compatible with sites that reject digest references.
          echo "deploy_tag=${IMAGE}:sha-${BUILD_SHA}-${RUN_ID}-${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.deploy_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.config.outputs.service_version }}
            io.icicle.project=${{ steps.config.outputs.project_name }}
            io.icicle.service-type=${{ steps.config.outputs.service_type }}
          build-args: |
            ${{ steps.buildtime.outputs.build_args }}
            TEMPLATE_VERSION=${{ env.TEMPLATE_VERSION }}
            TEMPLATE_REVISION=${{ job.workflow_sha }}
          cache-from: type=gha,scope=${{ steps.config.outputs.service_name }}-${{ steps.config.outputs.runtime_type }}
          cache-to: type=gha,mode=max,scope=${{ steps.config.outputs.service_name }}-${{ steps.config.outputs.runtime_type }}

      - name: Deploy image and verify rollout
        env:
          TAPIS_TOKEN: ${{ secrets.TAPIS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          HEALTHCHECK_TOKEN: ${{ secrets.HEALTHCHECK_TOKEN }}
          POD_NAME: ${{ steps.config.outputs.pod_name }}
          RUNTIME: ${{ steps.config.outputs.runtime_type }}
          IMAGE: ${{ steps.image.outputs.deploy_tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_SHA: ${{ github.sha }}
          HEALTH_URL: ${{ steps.config.outputs.health_url }}
          ROLLOUT_TIMEOUT: ${{ steps.config.outputs.rollout_timeout }}
        run: |
          set -eu
          printf 'Built image: %s\nDigest: %s\n' "$IMAGE" "$IMAGE_DIGEST"
          printf 'Image digest: `%s`\n\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          python "$TEMPLATES_DIR/scripts/deploy_tapis.py" \
            --pod "$POD_NAME" --image "$IMAGE" --runtime "$RUNTIME" \
            --build-sha "$BUILD_SHA" --health-url "$HEALTH_URL" \
            --timeout "$ROLLOUT_TIMEOUT"
