# ICICLE nginx config for static frontend services.
# Runs as the unprivileged `icicle` user, so pid and temp paths live under /tmp.
# This file is part of the template and is fetched by CI — do not edit locally.

worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Temp paths must be writable by the icicle user (default /var/lib/nginx
    # locations are not, when running non-root).
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    access_log /var/log/nginx/access.log;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/wasm;

    # Tapis terminates TLS at its ingress. That ingress must overwrite this
    # header; only accept a single HTTP(S) scheme, otherwise use our connection.
    map $http_x_forwarded_proto $icicle_forwarded_proto {
        default $scheme;
        http    http;
        https   https;
    }

    # Only filenames following the build fingerprint convention get immutable
    # caching: a final dot/dash token of 8+ hex characters, or 8+ base64url
    # characters containing a letter and digit. Other assets must revalidate.
    # Conservative misses (e.g. all-letter non-hex hashes) remain safe to serve.
    map $uri $icicle_asset_cache {
        default "no-cache";
        "~^/assets/(?:.*/)?[^/]+[.-](?:[A-Fa-f0-9]{8,}|(?=[A-Za-z0-9_-]*[0-9])(?=[A-Za-z0-9_-]*[A-Za-z])[A-Za-z0-9_-]{8,})\.[^/]+$" "public, max-age=31536000, immutable";
    }

    # An opt-in upgrade only forwards the WebSocket protocol. Empty values
    # suppress these hop-by-hop headers for ordinary requests and other upgrades.
    map "${BACKEND_WEBSOCKETS}:$http_upgrade" $icicle_upstream_upgrade {
        default "";
        ~*^on:websocket$ websocket;
    }
    map $icicle_upstream_upgrade $icicle_upstream_connection {
        default "";
        websocket upgrade;
    }

    server {
        listen      ${PORT};
        listen      [::]:${PORT};
        server_name _;
        root        /app/site;
        index       index.html;

        # Generated at startup; empty unless BACKEND_URL is configured.
        include /tmp/nginx/api.conf;

        # Health check. Returns 200 with the build SHA so the platform can
        # confirm the deploy landed the right build. There is no application
        # process here, so the SHA is read from a file written at build time.
        #
        # No `alias` here on purpose: try_files is unreliable when combined with
        # alias. try_files resolves against the server-level `root /app/site`,
        # so /.build_sha maps to /app/site/.build_sha unambiguously.
        location = /healthcheck {
            # Orchestrators poll this every few seconds — keep it out of the
            # access log, and don't log a missing file as an error.
            access_log off;
            log_not_found off;

            # The file holds a bare SHA, not JSON. See node-frontend/service-setup.md.
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            # If the file is somehow missing, still return 200 so liveness
            # checks pass; the body just won't carry a SHA.
            try_files /.build_sha @healthcheck_empty;
        }

        location @healthcheck_empty {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "";
        }

        # Keep missing assets out of the SPA fallback. The cache map grants
        # immutable caching only to filenames following the fingerprint contract.
        location /assets/ {
            add_header Cache-Control $icicle_asset_cache;
            try_files $uri =404;
        }

        # index.html must NEVER be cached, or clients keep loading an old app
        # that references asset filenames the server no longer has.
        location = /index.html {
            add_header Cache-Control "no-store" always;
        }

        # SPA fallback: any path that doesn't match a real file serves
        # index.html, so client-side routing (React Router, Vue Router) works
        # on deep links and page refreshes.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
